<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>베스티 투자 유형 테스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, like a shareable MBTI test. Moon-cream light / night-sky dark. */
:root{
  --bg:#f6f2ea; --surface:#fffdf8; --fg:#2a2440; --muted:#6c6584; --line:#e6e0d2;
  --accent:#6b4fd8; --accent-fg:#ffffff; --moon:#ffd96a; --star:#c9b7ff;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13112c; --surface:#1e1b45; --fg:#f3efff; --muted:#aaa4c9; --line:#312d5f;
    --accent:#b7a6ff; --accent-fg:#1a1540; --moon:#ffd966; --star:#6f5fc4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112c; --surface:#1e1b45; --fg:#f3efff; --muted:#aaa4c9; --line:#312d5f;
  --accent:#b7a6ff; --accent-fg:#1a1540; --moon:#ffd966; --star:#6f5fc4; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
img{max-width:100%}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.av{display:block;object-fit:contain}
.av.sq{border-radius:22%}

/* intro */
.sky{position:relative;border-radius:28px;background:linear-gradient(180deg,var(--surface),var(--bg));border:1px solid var(--line);padding:28px 22px 24px;overflow:hidden;text-align:center}
.sky .moon{position:absolute;top:-34px;right:-34px;width:120px;height:120px;border-radius:50%;background:var(--moon);box-shadow:inset -18px -10px 0 rgba(0,0,0,.08)}
.sky .star{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--star)}
.sky h1{font-size:38px;margin-top:10px;position:relative}
.sky .sub{color:var(--muted);margin-top:10px;font-size:15px}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:22px 0 8px}
.hero .av.sq{width:52px;height:52px}
.hero .av.bestie{width:74px;height:86px;margin-inline:6px}
.hero .av.sq:nth-child(odd){transform:translateY(-6px)}
.meta{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--muted);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:20px;letter-spacing:.02em;transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line);font-size:17px}
.stack{display:grid;gap:10px;margin-top:22px}

/* quiz */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px 12px;z-index:2}
.progress{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--accent);transition:width .35s ease}
.q{margin-top:14px}
.q .scene{color:var(--muted);font-size:13px;font-weight:500;margin-bottom:8px}
.q h2{font-size:27px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:15px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-size:15.5px;line-height:1.45;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.opt b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--accent);flex:0 0 1.4em}
.opt span{min-width:0}
.opt:hover{border-color:var(--accent);transform:translateX(3px)}
.opt.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.q.enter{animation:slide .3s ease both}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.back{margin-top:18px;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}

/* loading */
.calc{text-align:center;padding-block:60px}
.calc .orbit{width:90px;height:90px;margin:0 auto 20px;position:relative}
.calc .orbit .m{position:absolute;inset:18px;border-radius:50%;background:var(--moon)}
.calc .orbit .s{position:absolute;top:0;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);transform-origin:7px 45px;animation:orb 1.1s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
.calc h2{font-size:24px}
.calc p{color:var(--muted);margin-top:6px}

/* result */
.card{border-radius:28px;border:1px solid var(--line);background:var(--surface);overflow:hidden;animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.card .head{padding:30px 22px 22px;text-align:center;color:#1b1630;background:var(--c);position:relative}
.card .head .eyebrow{color:rgba(20,15,40,.65)}
.card .head .av{width:150px;height:150px;margin:10px auto 6px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.card .head .av.bestie{width:140px;height:160px}
.card .head h2{font-size:40px}
.card .head .tag{font-size:15px;font-weight:500;margin-top:6px;color:rgba(20,15,40,.75)}
.card .head .ribbon{position:absolute;top:14px;left:14px;font-family:var(--display);font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.55);color:#1b1630}
.card .body{padding:22px}
.card .body p.lead{font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.tile{border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--c) 14%,var(--surface));min-width:0}
.tile .k{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.tile .v{font-size:14.5px;margin-top:4px}
.quote{margin-top:18px;border-left:4px solid var(--c);padding:10px 14px;border-radius:0 14px 14px 0;background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.quote .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.quote .v{font-family:var(--display);font-size:19px;margin-top:2px}
.match{display:flex;gap:10px;margin-top:18px}
.match .m{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.match .m .av{width:40px;height:40px;flex:0 0 40px}
.match .m .av.bestie{height:46px}
.match .k{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.match .v{font-family:var(--display);font-size:16px}
.match .why{font-size:12px;color:var(--muted)}
.tip{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--bg);font-size:14.5px}
.tip b{font-family:var(--display);font-weight:400;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.others{margin-top:28px}
.others h3{font-size:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:13.5px}
.chip .av{width:26px;height:26px}
.chip .av.sq{border-radius:50%}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <!-- INTRO -->
  <section id="intro">
    <div class="sky">
      <div class="moon"></div>
      <span class="star" style="top:22px;left:26px"></span>
      <span class="star" style="top:70px;left:60px;width:4px;height:4px"></span>
      <span class="star" style="top:40px;right:150px;width:5px;height:5px"></span>
      <span class="star" style="bottom:60px;left:30px;width:4px;height:4px"></span>
      <p class="eyebrow">달나라 살리기 프로젝트</p>
      <h1>나는 어떤<br>투자 유형일까?</h1>
      <p class="sub">별똥별이 「주식.」 한마디를 남기고 갔어요.<br>달토끼 베스티와 친구들 중 당신은 누구?</p>
      <div class="hero" id="hero"></div>
      <div class="meta"><span>⏱ 1분</span><span>8문항</span><span>6가지 유형</span></div>
    </div>
    <div class="stack">
      <button class="btn" id="start">테스트 시작하기</button>
    </div>
    <p class="foot">INVESTING101 베스티 세계관 · 재미로 보는 성향 테스트예요</p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden>
    <div class="topbar">
      <div class="progress"><span id="pnum">1/8</span><div class="bar"><i id="pbar"></i></div></div>
    </div>
    <div id="qbox"></div>
    <button class="back" id="back">← 이전 질문</button>
  </section>

  <!-- CALC -->
  <section id="calc" class="calc" hidden>
    <div class="orbit"><div class="m"></div><div class="s"></div></div>
    <h2>별똥별이 분석 중…</h2>
    <p>달에서 지구까지 신호를 보내는 중이에요</p>
  </section>

  <!-- RESULT -->
  <section id="result" hidden>
    <div id="card"></div>
    <div class="stack">
      <button class="btn" id="share">결과 복사해서 공유하기</button>
      <button class="btn ghost" id="retry">다시 테스트하기</button>
    </div>
    <div class="others">
      <h3>다른 유형도 구경하기</h3>
      <div class="chips" id="chips"></div>
    </div>
    <p class="foot">INVESTING101 베스티 세계관 · 재미로 보는 성향 테스트예요</p>
  </section>

</div>
<div class="toast" id="toast">복사했어요!</div>

var ORDER=['bestie','ton','rai','rob','randy','cred']; // tie-break: rarer first

   ['우리 동네가 다시 푸르게 되게요','bestie'],['나랑 잘 맞는 짝 만나게요','rai']]},

 {scene:'떡상!',q:'드디어 떡상했다. 제일 먼저 할 일은?',o:[

/* ---------- state ---------- */
var $=function(id){return document.getElementById(id)};
var screens=['intro','quiz','calc','result'];
var answers=[],cur=0;
function show(id){screens.forEach(function(s){$(s).hidden=(s!==id)});window.scrollTo(0,0)}

function renderHero(){
  $('hero').innerHTML=av('cred')+av('randy')+av('bestie')+av('rob')+av('ton')+av('rai');
}
function renderQ(){
  var q=Q[cur];
  $('pnum').textContent=(cur+1)+'/'+Q.length;
  $('pbar').style.width=((cur)/Q.length*100)+'%';
  var html='<div class="q enter"><p class="scene">'+q.scene+'</p><h2>'+q.q+'</h2><div class="opts">';
  q.o.forEach(function(opt,i){
    var picked=answers[cur]===i?' picked':'';
    html+='<button class="opt'+picked+'" data-i="'+i+'"><b>'+'ABCD'[i]+'</b><span>'+opt[0]+'</span></button>';
  });
  html+='</div></div>';
  $('qbox').innerHTML=html;
  $('back').hidden=cur===0;
  Array.prototype.forEach.call($('qbox').querySelectorAll('.opt'),function(b){
    b.addEventListener('click',function(){pick(+b.dataset.i,b)});
  });
}
function pick(i,btn){
  Array.prototype.forEach.call($('qbox').querySelectorAll('.opt'),function(b){b.classList.remove('picked')});
  btn.classList.add('picked');
  answers[cur]=i;
  setTimeout(function(){
    if(cur<Q.length-1){cur++;renderQ()}else{finish()}
  },260);
}
function score(){
  var s={};ORDER.forEach(function(k){s[k]=0});
  answers.forEach(function(a,qi){ if(a==null)return; s[Q[qi].o[a][1]]++ });
  var best=ORDER[0];
  ORDER.forEach(function(k){ if(s[k]>s[best])best=k });
  return best;
}
function finish(){
  $('pbar').style.width='100%';
  show('calc');
  var key=score();
  setTimeout(function(){showResult(key,false)},1400);
}
function tile(k,v){return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
function showResult(key,fromLink){
  var t=TYPES[key];
  var g=TYPES[t.good],b=TYPES[t.bad];
  $('card').innerHTML=
   '<div class="card" style="--c:'+t.color+'">'+
    '<div class="head"><span class="ribbon">'+t.colorName+'</span><p class="eyebrow">'+(fromLink?'이 투자 유형은':'나의 투자 유형')+'</p>'+av(key)+
      '<h2>'+t.name+'</h2><p class="tag">'+t.title+' · '+t.tag+'</p></div>'+
    '<div class="body"><p class="lead">'+t.lead+'</p>'+
      '<div class="grid2">'+tile('강점',t.strong)+tile('약점',t.weak)+'</div>'+
      '<div class="quote"><div class="k">'+t.quoteBy+'</div><div class="v">「'+t.quote+'」</div></div>'+
      '<div class="match">'+
        '<div class="m">'+av(t.good)+'<div><div class="k">잘 맞는 친구</div><div class="v">'+g.name+'</div><div class="why">'+t.goodWhy+'</div></div></div>'+
        '<div class="m">'+av(t.bad)+'<div><div class="k">조심할 친구</div><div class="v">'+b.name+'</div><div class="why">'+t.badWhy+'</div></div></div>'+
      '</div>'+
      '<div class="tip"><b>베스티의 처방</b><br>'+t.tip+'</div>'+
    '</div></div>';
  $('share').dataset.key=key;
  $('share').dataset.mode=fromLink?'test':'copy';
  $('share').textContent=fromLink?'나도 테스트하기':'결과 복사해서 공유하기';
  $('retry').textContent=fromLink?'처음으로':'다시 테스트하기';
  $('chips').innerHTML=ORDER.filter(function(k){return k!==key}).map(function(k){
    return '<button class="chip" data-k="'+k+'">'+av(k)+TYPES[k].name+' · '+TYPES[k].title+'</button>';
  }).join('');
  Array.prototype.forEach.call($('chips').querySelectorAll('.chip'),function(c){
    c.addEventListener('click',function(){showResult(c.dataset.k,true)});
  });
  show('result');
}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}
function shareText(key){
  var t=TYPES[key];
  var url=location.href.split('#')[0]+'#'+key;
  return '나의 베스티 투자 유형은 「'+t.name+' · '+t.title+'」!\n'+t.tag+'\n\n'+t.quoteBy+': 「'+t.quote+'」\n\n너는 어떤 유형? 👉 '+url;
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
}
function copy(text){
  var done=function(){toast('복사했어요! 친구에게 붙여넣기')};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){fallbackCopy(text);done()});
  }else{fallbackCopy(text);done()}
}
function startQuiz(){answers=[];cur=0;renderQ();show('quiz')}

$('start').addEventListener('click',startQuiz);
$('back').addEventListener('click',function(){if(cur>0){cur--;renderQ()}});
$('share').addEventListener('click',function(){
  if($('share').dataset.mode==='test'){startQuiz();return}
  copy(shareText($('share').dataset.key));
});
$('retry').addEventListener('click',function(){answers=[];cur=0;show('intro')});

renderHero();
var h=(location.hash||'').replace('#','');
if(TYPES[h]){showResult(h,true)}else{show('intro')}
</script>
